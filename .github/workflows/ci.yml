name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check app tests --select=E9,F63,F7,F82

      - name: Run tests
        run: pytest -v --tb=short --junitxml=test-results.xml

      - name: Verify app imports and routes register
        run: |
          python -c "
          from app.main import app
          paths = app.openapi()['paths']
          required = ['/api/v1/generate', '/api/v1/health', '/api/v1/retrieve', '/api/v1/metrics']
          missing = [p for p in required if p not in paths]
          assert not missing, f'missing routes: {missing}'
          print(f'{len(paths)} routes registered')
          "

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t interiorai:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name ia -p 8001:8001 interiorai:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8001/api/v1/health > /dev/null; then
              echo "Container healthy after ${i}s"
              curl -s http://localhost:8001/api/v1/health
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to become healthy"
          docker logs ia
          exit 1
