services:
  api:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # In a container, "localhost" is the container itself - point at the
      # ollama service (or omit Ollama and rely on a cloud provider).
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    volumes:
      - vector_data:/app/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  vector_data:
  ollama_models:
